<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Короткі уроки й тести про безпечне користування інтернетом для початківців.">
<title>Безпечний інтернет для новачків</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d5fd1'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#app">До змісту</a>

<header class="topbar">
  <div class="topbar-in">
    <button class="menu-btn" id="menuBtn" aria-label="Відкрити список модулів" aria-expanded="false" aria-controls="sidebar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <svg class="logo" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M16 6l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z" fill="#fff"/></svg>
      <span id="title">Безпечний інтернет</span>
    </div>
    <button class="userbtn" id="userBtn" hidden aria-label="Змінити учасника" title="Змінити учасника">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span id="userName"></span>
    </button>
    <div class="overall" aria-live="polite">
      <span id="progressText"></span>
      <div class="bar" role="progressbar" aria-label="Загальний прогрес" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barFill"></i></div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Модулі курсу">
    <p class="side-title">Модулі курсу</p>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main id="app" tabindex="-1"><p class="loading">Завантаження…</p></main>
</div>

<script src="app.js"></script>
</body>
</html>
